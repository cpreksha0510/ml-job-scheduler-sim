# ============================================================================
#  workload_light.cfg  –  Lightly loaded workload (~45% capacity demand)
# ============================================================================
seed = 42
horizon = 1000

# Inference: light Poisson arrivals, short bursts
infer_rate = 0.07
infer_burst_min = 1
infer_burst_max = 3
infer_priority = 10
infer_slack = 1.5
infer_mem_min = 256
infer_mem_max = 512

# Training: sparse arrivals, moderate bursts, no deadline
train_rate = 0.003
train_burst_min = 30
train_burst_max = 45
train_priority = 2
train_slack = -1.0
train_mem_min = 4096
train_mem_max = 8192

# Preprocessing: small batches, medium bursts
preproc_rate = 0.006
preproc_batch_size = 2
preproc_burst_min = 6
preproc_burst_max = 10
preproc_priority = 5
preproc_slack = 3.0
preproc_mem_min = 1024
preproc_mem_max = 2048
