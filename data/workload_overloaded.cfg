# ============================================================================
#  workload_overloaded.cfg  –  Overloaded workload (demand > capacity)
# ============================================================================
seed = 42
horizon = 1000

# Inference: dense Poisson arrivals
infer_rate = 0.20
infer_burst_min = 2
infer_burst_max = 4
infer_priority = 10
infer_slack = 1.5
infer_mem_min = 256
infer_mem_max = 512

# Training: frequent long bursts, no deadline
train_rate = 0.007
train_burst_min = 60
train_burst_max = 100
train_priority = 2
train_slack = -1.0
train_mem_min = 8192
train_mem_max = 32768

# Preprocessing: frequent large batches
preproc_rate = 0.015
preproc_batch_size = 3
preproc_burst_min = 10
preproc_burst_max = 15
preproc_priority = 5
preproc_slack = 2.5
preproc_mem_min = 1024
preproc_mem_max = 2048
