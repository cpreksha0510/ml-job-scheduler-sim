# ============================================================================
#  workload_medium.cfg  –  Medium loaded workload (~80% capacity demand)
# ============================================================================
seed = 42
horizon = 1000

# Inference: moderate Poisson arrivals
infer_rate = 0.12
infer_burst_min = 1
infer_burst_max = 4
infer_priority = 10
infer_slack = 1.5
infer_mem_min = 256
infer_mem_max = 512

# Training: regular long training jobs, no deadline
train_rate = 0.005
train_burst_min = 50
train_burst_max = 70
train_priority = 2
train_slack = -1.0
train_mem_min = 4096
train_mem_max = 16384

# Preprocessing: regular batches
preproc_rate = 0.008
preproc_batch_size = 3
preproc_burst_min = 8
preproc_burst_max = 12
preproc_priority = 5
preproc_slack = 3.0
preproc_mem_min = 1024
preproc_mem_max = 2048
